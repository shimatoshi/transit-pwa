<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>乗換案内</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
:root {
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --bg: #f1f5f9;
  --card: #fff;
  --text: #1e293b;
  --muted: #94a3b8;
  --border: #e2e8f0;
  --green: #16a34a;
  --orange: #ea580c;
  --red: #dc2626;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

/* Header */
.header {
  background: linear-gradient(135deg, #0f172a, #1e3a5f);
  color: white;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header svg { width: 22px; height: 22px; }
.header h1 { font-size: 17px; font-weight: 600; }
.header .badge {
  margin-left: auto;
  font-size: 10px;
  background: rgba(255,255,255,0.15);
  padding: 2px 8px;
  border-radius: 10px;
}

/* Search Card */
.search-card {
  background: var(--card);
  margin: 12px;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}
.station-fields {
  padding: 12px 12px 0;
}
.field-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  position: relative;
}
.field-label {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}
.field-label.dep { background: var(--green); }
.field-label.via { background: var(--orange); }
.field-label.arr { background: var(--red); }
.field-input {
  flex: 1;
  position: relative;
}
.field-input input {
  width: 100%;
  padding: 9px 32px 9px 10px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  background: #f8fafc;
  transition: border-color 0.15s;
}
.field-input input:focus {
  border-color: var(--blue);
  background: white;
}
.field-input input::placeholder { color: var(--muted); }
.field-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border: none;
  background: #cbd5e1;
  color: white;
  border-radius: 50%;
  font-size: 12px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.field-input input:not(:placeholder-shown) ~ .field-clear { display: flex; }
.remove-via {
  width: 28px;
  height: 28px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

/* Autocomplete */
.ac-dropdown {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  max-height: 220px;
  overflow-y: auto;
  z-index: 50;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  margin-top: 4px;
}
.ac-dropdown.show { display: block; }
.ac-item {
  padding: 10px 12px;
  border-bottom: 1px solid #f8fafc;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ac-item:active { background: #eff6ff; }
.ac-item .ac-name { font-size: 14px; font-weight: 500; }
.ac-item .ac-sub { font-size: 11px; color: var(--muted); }

/* Controls row */
.controls {
  display: flex;
  padding: 8px 12px;
  gap: 8px;
  border-top: 1px solid var(--border);
}
.add-via-btn {
  font-size: 13px;
  color: var(--blue);
  background: none;
  border: 1px dashed var(--blue);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
}
.swap-btn {
  font-size: 13px;
  color: var(--muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  margin-left: auto;
}
.opt-toggles {
  display: flex;
  flex-wrap: wrap;        /* 座席セレクトを足したので狭い画面では折り返す */
  gap: 6px 14px;
  padding: 0 12px 8px;
  font-size: 13px;
  color: var(--muted);
}
.opt-toggles label {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.opt-toggles input { accent-color: var(--blue); }
/* 予算(運賃上限)。5桁(¥12,345)が収まる幅 */
.opt-toggles input[type="number"] {
  width: 72px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 4px;
  font-size: 13px;
  color: var(--text);
  background: #fff;
  text-align: right;
}
.opt-toggles select {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 4px;
  font-size: 13px;
  color: var(--text);
  background: #fff;
}
/* 交通手段(すべて/鉄道のみ/バスのみ)。ソートバーと同じセグメント型に揃える */
.mode-toggles { display: flex; gap: 6px; padding: 0 12px 8px; }
.mode-btn {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
}
.mode-btn.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.mode-btn.on[data-mode="bus"] { background: #2e7d32; border-color: #2e7d32; }
/* バス限定では特急/新幹線/座席の設定が効かないので触れないようにする */
.opt-toggles.dim { opacity: .4; pointer-events: none; }
/* 鉄道のみモードの詳細: 全事業者/JRのみ/私鉄のみ。mode-toggles と同じセグメント型 */
.rail-toggles { display: flex; gap: 6px; padding: 0 12px 8px; }
.rail-toggles[hidden] { display: none; }
.rail-btn {
  flex: 1;
  padding: 7px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 8px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
}
.rail-btn.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
/* 私鉄のみ選択時の事業者絞り込み(検索+スクロール選択) */
.op-picker { padding: 0 12px 8px; }
.op-picker[hidden] { display: none; }
.op-summary {
  padding: 8px 10px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--muted);
  background: #f8fafc;
  cursor: pointer;
}
.op-summary b { color: var(--text); }
.op-list-wrap { margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.op-list-wrap[hidden] { display: none; }
.op-search {
  width: 100%;
  box-sizing: border-box;
  border: none;
  border-bottom: 1px solid var(--border);
  border-radius: 8px 8px 0 0;
  padding: 8px 10px;
  font-size: 13px;
  outline: none;
}
.op-list { max-height: 220px; overflow-y: auto; }
.op-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
}
.op-item input { accent-color: var(--blue); }
.op-item .cnt { margin-left: auto; font-size: 11px; color: var(--muted); }
.op-actions { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--border); }
.op-actions button {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
}
.search-btn {
  width: 100%;
  padding: 13px;
  background: var(--blue);
  color: white;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.search-btn:active { background: var(--blue-dark); }
.search-btn:disabled { background: #94a3b8; }

/* Results */
.results { padding: 0 12px 20px; }
.route-card {
  background: var(--card);
  border-radius: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  overflow: hidden;
}
.route-summary {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}
.route-summary .time {
  font-size: 22px;
  font-weight: 700;
  color: var(--blue);
}
.route-summary .meta {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.route-detail {
  padding: 0;
}
.route-detail.collapsed { display: none; }
.midstops.collapsed { display: none; }
.toggle-detail {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  font-size: 12px;
  color: var(--blue);
  cursor: pointer;
  border-top: 1px solid var(--border);
  background: #f8fafc;
}

/* Route steps */
.step {
  display: flex;
  align-items: stretch;
}
.step-line {
  width: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}
.step-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--blue);
  border: 3px solid white;
  box-shadow: 0 0 0 2px var(--blue);
  z-index: 2;
  flex-shrink: 0;
}
.step-dot.transfer { background: var(--orange); box-shadow: 0 0 0 2px var(--orange); }
.step-dot.walk { background: var(--muted); box-shadow: 0 0 0 2px var(--muted); }
.step-dot.end { background: var(--red); box-shadow: 0 0 0 2px var(--red); }
.step-bar {
  width: 3px;
  flex: 1;
  min-height: 20px;
}
.step-bar.rail { background: var(--blue); }
.step-bar.transfer { background: var(--orange); background: repeating-linear-gradient(to bottom, var(--orange) 0,var(--orange) 4px,transparent 4px,transparent 8px); }
.step-bar.walk { background: repeating-linear-gradient(to bottom, var(--muted) 0,var(--muted) 3px,transparent 3px,transparent 6px); }
.step-bar.none { background: none; }
.step-content {
  flex: 1;
  padding: 4px 16px 14px 10px;
  min-width: 0;
}
.step-station {
  font-size: 15px;
  font-weight: 600;
}
.step-info {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.step-info .line-tag {
  display: inline-block;
  background: #eff6ff;
  color: var(--blue);
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
  font-size: 11px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
.no-route {
  text-align: center;
  padding: 24px;
  color: var(--red);
  font-size: 14px;
}

/* Time selector */
.time-selector {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
}
.time-selector select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  background: #f8fafc;
}
.time-selector input[type="time"] {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  background: #f8fafc;
}

/* Status bar */
.status-bar {
  text-align: center;
  padding: 6px;
  font-size: 11px;
  color: var(--muted);
}
.credits {
  padding: 4px 16px 10px;
  font-size: 10px;
  line-height: 1.7;
  color: var(--muted);
  text-align: center;
}
.credits a { color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 10h16"/><path d="M8 17v4M16 17v4M6 21h4M14 21h4"/>
  </svg>
  <h1>乗換案内</h1>
  <span class="badge" id="badge">読込中</span>
</div>

<div class="search-card">
  <div class="station-fields" id="station-fields">
    <!-- Departure -->
    <div class="field-row" data-role="dep">
      <span class="field-label dep">発</span>
      <div class="field-input">
        <input type="text" placeholder="出発駅" autocomplete="off">
        <button class="field-clear" onclick="clearField(this)">&times;</button>
        <div class="ac-dropdown"></div>
      </div>
    </div>
    <!-- Arrival -->
    <div class="field-row" data-role="arr">
      <span class="field-label arr">着</span>
      <div class="field-input">
        <input type="text" placeholder="到着駅" autocomplete="off">
        <button class="field-clear" onclick="clearField(this)">&times;</button>
        <div class="ac-dropdown"></div>
      </div>
    </div>
  </div>
  <!-- Time selector -->
  <div class="time-selector">
    <select id="time-type">
      <option value="dep">出発</option>
      <option value="arr">到着</option>
      <option value="now">現在時刻</option>
    </select>
    <input type="time" id="time-input" value="">
    <input type="date" id="date-input" value="">
  </div>
  <div class="controls">
    <button class="add-via-btn" onclick="addVia()">+ 経由駅</button>
    <button class="swap-btn" onclick="swapDepArr()">入替</button>
  </div>
  <div class="mode-toggles" id="mode-toggles">
    <button type="button" class="mode-btn on" data-mode="all" onclick="setTravelMode('all')">すべて</button>
    <button type="button" class="mode-btn" data-mode="rail" onclick="setTravelMode('rail')">&#128649; 鉄道のみ</button>
    <button type="button" class="mode-btn" data-mode="bus" onclick="setTravelMode('bus')">&#128652; バスのみ</button>
  </div>
  <!-- 鉄道のみモードの詳細: JR/私鉄の路線種別と、私鉄の事業者絞り込み -->
  <div class="rail-toggles" id="rail-toggles" hidden>
    <button type="button" class="rail-btn on" data-rail="all" onclick="setRailFilter('all')">全事業者</button>
    <button type="button" class="rail-btn" data-rail="jr" onclick="setRailFilter('jr')">JRのみ</button>
    <button type="button" class="rail-btn" data-rail="private" onclick="setRailFilter('private')">私鉄のみ</button>
  </div>
  <div class="op-picker" id="op-picker" hidden>
    <div class="op-summary" id="op-summary" onclick="toggleOpList()"></div>
    <div class="op-list-wrap" id="op-list-wrap" hidden>
      <input type="text" class="op-search" id="op-search" placeholder="事業者名で検索 (例: 東急)" oninput="renderOpList()">
      <div class="op-list" id="op-list"></div>
      <div class="op-actions">
        <button type="button" onclick="clearOps()">選択解除</button>
        <button type="button" onclick="toggleOpList()">閉じる</button>
      </div>
    </div>
  </div>
  <div class="opt-toggles" id="opt-toggles">
    <label><input type="checkbox" id="opt-express" checked onchange="saveOpts()"> 特急を使う</label>
    <label><input type="checkbox" id="opt-shinkansen" checked onchange="saveOpts()"> 新幹線を使う</label>
    <label>座席
      <select id="opt-seat" onchange="setSeat(this.value)">
        <option value="reserved">指定席</option>
        <option value="nonreserved">自由席</option>
      </select>
    </label>
    <label title="運賃の上限。指定すると予算内に収まる経路だけを表示します">予算
      <input type="number" id="opt-budget" min="0" step="100" inputmode="numeric"
             placeholder="上限なし" onchange="setBudget(this.value)"> 円以内
    </label>
  </div>
  <button class="search-btn" id="search-btn" onclick="doSearch()" disabled>検索</button>
</div>

<div class="results" id="results">
  <div class="empty-state">
    <div class="icon">&#128644;</div>
    <p>駅名を入力して経路を検索</p>
  </div>
</div>

<div class="status-bar" id="status">データ読み込み中...</div>
<!-- 出典表示。CC BY 系のデータは表示が義務なので trains_v3_meta.json の sources から生成する -->
<div class="credits" id="credits"></div>

<script src="platform_match.js?v=1"></script>
<script src="router_v3.js?v=13"></script>
<script>
// === Global State ===
let graph = null;
let freqData = null;
const selectedStations = {}; // fieldId -> stationIndex

// Set default time to now
document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('time-input').value = `${hh}:${mm}`;
  document.getElementById('time-type').value = 'now';
  // 日付は今日をデフォルト
  const di = document.getElementById('date-input');
  if (di) di.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
});

// 祝日(休日=ekitan dw=2扱い)を年から計算する。
// 以前は2026年ぶんを直書きしていたが、日付入力に上限が無いので2027年以降を選ぶと
// 祝日が全部「平日」に落ち、元日でも平日ダイヤで案内していた。毎年の追記漏れが
// そのままダイヤの間違いになるので、規則で出す。
//
// 2020年の改正後(体育の日→スポーツの日、天皇誕生日2/23)の規則。過去日は対象外。
// 春分/秋分は 1900-2099 で通用する近似式(海上保安庁の略算式)。
const FIXED_HOLIDAYS = [
  [1, 1], [2, 11], [2, 23], [4, 29], [5, 3], [5, 4], [5, 5], [8, 11], [11, 3], [11, 23],
];
// [月, 第n週, 曜日] ハッピーマンデー
const NTH_MONDAY_HOLIDAYS = [[1, 2], [7, 3], [9, 3], [10, 2]];

const _holidayCache = new Map();
function jpHolidays(year) {
  if (_holidayCache.has(year)) return _holidayCache.get(year);
  const ymd = (m, d) => `${year}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const set = new Set();
  for (const [m, d] of FIXED_HOLIDAYS) set.add(ymd(m, d));
  for (const [m, nth] of NTH_MONDAY_HOLIDAYS) {
    const first = new Date(year, m - 1, 1).getDay();       // 0=日
    const day = 1 + ((8 - first) % 7) + (nth - 1) * 7;     // その月の第nth月曜
    set.add(ymd(m, day));
  }
  const y = year - 1980, leap = Math.floor(y / 4);
  set.add(ymd(3, Math.floor(20.8431 + 0.242194 * y - leap)));   // 春分の日
  set.add(ymd(9, Math.floor(23.2488 + 0.242194 * y - leap)));   // 秋分の日

  const has = d => set.has(`${year}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
  const add = d => set.add(`${year}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);

  // 振替休日: 祝日が日曜なら、その後で祝日でない最初の日を休日にする
  for (const key of [...set]) {
    const d = new Date(key + 'T00:00:00');
    if (d.getDay() !== 0) continue;
    const n = new Date(d);
    do { n.setDate(n.getDate() + 1); } while (has(n));
    add(n);
  }
  // 国民の休日: 祝日に前後を挟まれた平日(2026-09-22 など)。挟まれるのが1日のときだけ
  for (const key of [...set]) {
    const d = new Date(key + 'T00:00:00');
    const mid = new Date(d); mid.setDate(mid.getDate() + 1);
    const nxt = new Date(d); nxt.setDate(nxt.getDate() + 2);
    if (!has(mid) && has(nxt) && mid.getDay() !== 0) add(mid);
  }
  _holidayCache.set(year, set);
  return set;
}

// 検索日の運転日種別: 0=平日 1=土曜 2=休日(日祝)
function getDayType() {
  const di = document.getElementById('date-input');
  const v = di && di.value;
  const d = v ? new Date(v + 'T00:00:00') : new Date();
  const dow = d.getDay();             // 0=日,6=土
  const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (dow === 0 || jpHolidays(d.getFullYear()).has(key)) return 2;
  if (dow === 6) return 1;
  return 0;
}

// === Data Loading ===
// 実在列車データ(CSA): trains_v3.bin.gz + meta + graph(駅名) + fares
//
// ここのURLは sw.js の DATA と完全に一致していなければならない。?v= を上げるときは
// 必ず両方を同時に直すこと。ズレると Cache API の照合が外れてオフラインで読めなくなる。
// (念のため下で CACHE_URLS を送って自己修復もさせている)
//
// この4本は vercel.json で immutable にしてある。中身を差し替えたら ?v= を必ず上げること。
// 上げ忘れると、ブラウザのHTTPキャッシュが1年間古い方を返し続ける。
const DATA_URLS = {
  graph: 'graph_v2.json?v=6',
  meta:  'trains_v3_meta.json?v=4',
  fares: 'fares.json?v=11',
  bin:   'trains_v3.bin.gz?v=4',
};
const WORKER_URL = 'data_worker.js?v=2';
// のりば(ホーム番線)データ。無くても検索は動くので遅延ロード(失敗しても無視)
const PLATFORMS_URL = 'platforms.json?v=1';
let platformData = null;

// 起動の各段階に印を付ける。bench_load.js がこれを読んで内訳を出す。
// 本番でも DevTools の Performance に出るので、遅いときの切り分けに使える。
function perfMark(name) {
  try { performance.mark('transit:' + name); } catch {}
}

// 電波が弱い場所では最初の1回だけ失敗することがよくあるので、少し待って数回試す。
async function fetchWithRetry(url, attempts = 3) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
      return res;
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
  throw lastErr;
}

// r.json() を直に呼ぶと、キャプティブポータルのログインHTMLが返ってきたときに
// 「Unexpected token '<'」という原因不明のエラーになる。何が起きたか分かる形で落とす。
async function fetchJson(url) {
  const res = await fetchWithRetry(url);
  const ct = (res.headers.get('content-type') || '').toLowerCase();
  const text = await res.text();
  if (ct.includes('text/html') || /^\s*</.test(text)) {
    throw new Error(`${url}: JSONではなくHTMLが返りました(Wi-Fiのログイン画面かもしれません)`);
  }
  try {
    return JSON.parse(text);
  } catch {
    throw new Error(`${url}: データが壊れています`);
  }
}

async function fetchBin(url) {
  const res = await fetchWithRetry(url);
  let buf = await res.arrayBuffer();
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b) { // gzip magic → 手動解凍
    const ds = new DecompressionStream('gzip');
    const stream = new Response(buf).body.pipeThrough(ds);
    buf = await new Response(stream).arrayBuffer();
  } else if (u8[0] === 0x3c) { // '<' で始まる = HTMLが返ってきている
    throw new Error(`${url}: データではなくHTMLが返りました(Wi-Fiのログイン画面かもしれません)`);
  }
  return buf;
}

// trains_v3.bin.gz の取得〜CSA配列構築を Worker に投げる。
// 失敗しうる場所が多い(Worker非対応/CSPで作れない/importScriptsが取れない)ので、
// どこでコケてもメインスレッドだけで完走できる形にしてある。
function startBinWorker(binUrl) {
  if (typeof Worker === 'undefined') return null;
  let worker;
  try {
    worker = new Worker(WORKER_URL);
  } catch (e) {
    console.warn('Worker を作れませんでした。メインスレッドで読み込みます:', e);
    return null;
  }
  const pending = {};
  const settled = new Promise((resolve, reject) => { pending.resolve = resolve; pending.reject = reject; });
  worker.onmessage = ev => {
    const m = ev.data || {};
    if (m.type === 'built') pending.resolve(m.built);
    else if (m.type === 'error') pending.reject(new Error(m.message));
  };
  worker.onerror = ev => pending.reject(new Error('data_worker: ' + (ev.message || 'エラー')));
  // meta を待たずに取得を始める。ここが一番長いので、JSONのparseと重ねたい。
  worker.postMessage({ type: 'fetchBin', url: binUrl });
  return {
    build(meta, nStations) {
      // 構造化クローンを軽くするため、必要な2列だけ TypedArray にして transfer する
      const l = meta.trips.l, m = meta.trips.m || null;
      const tripLine = new Int32Array(l.length);
      for (let i = 0; i < l.length; i++) tripLine[i] = l[i];
      let tripMode = null;
      if (m) { tripMode = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) tripMode[i] = m[i]; }
      const transfer = tripMode ? [tripLine.buffer, tripMode.buffer] : [tripLine.buffer];
      worker.postMessage({ type: 'build', tripLine, tripMode, nStations }, transfer);
      return settled;
    },
    terminate() { try { worker.terminate(); } catch {} },
  };
}

// 初回訪問だけ、SWがこのページを制御し始めるのを少しだけ待つ。
//
// 待たずに取りに行くと、ページの取得はSWを通らないのでキャッシュに残らず、SW側が
// オフライン用に同じ11MBをもう一度落とすことになる (初回の通信量が丸ごと2倍)。
// 制御下に入ってから取れば、その取得自体がそのままオフライン用のキャッシュになる。
// SWが来ない環境(未対応/プライベートモード/登録失敗)で止まらないよう上限を切る。
const SW_CONTROL_WAIT_MS = 2500;
// 登録はここで1回だけ。制御待ちと下の更新監視で同じ registration を使う。
const swRegistration = ('serviceWorker' in navigator)
  ? navigator.serviceWorker.register('sw.js') : null;

function awaitServiceWorkerControl() {
  if (!swRegistration) return Promise.resolve(false);
  if (navigator.serviceWorker.controller) return Promise.resolve(true);
  return new Promise(resolve => {
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      navigator.serviceWorker.removeEventListener('controllerchange', onChange);
      resolve(ok);
    };
    const onChange = () => finish(true);
    const timer = setTimeout(() => finish(false), SW_CONTROL_WAIT_MS);
    navigator.serviceWorker.addEventListener('controllerchange', onChange);
    // 登録そのものが失敗するなら待つ意味が無いので即諦める
    swRegistration.catch(() => finish(false));
  });
}

async function loadData() {
  try {
    perfMark('load-start');
    await awaitServiceWorkerControl();
    perfMark('sw-ready');
    // Worker には真っ先に一番重いファイル(4MB超)を取りに行かせる
    const binWorker = startBinWorker(DATA_URLS.bin);
    const [graphData, meta, fares] = await Promise.all([
      fetchJson(DATA_URLS.graph),
      fetchJson(DATA_URLS.meta),
      fetchJson(DATA_URLS.fares),
    ]);
    perfMark('json-ready');
    graph = graphData;
    // Pre-build name index for fast search
    graph._nameIndex = [];
    for (let i = 0; i < graph.stations.length; i++) {
      const s = graph.stations[i];
      graph._nameIndex.push({
        id: i,
        name: s.n,
        norm: normName(s.n),      // 全角/半角ゆれを吸収した検索キー(searchStations)
        nameEn: foldLatin(s.e || ''),
        kana: s.r || '',
        pref: s.p,
        // バス停は路線名(l)を持たず系統名(sys)を持つ。路線色ロジックが系統名で
        // 暴発しないようキーを分けてある
        lines: s.m ? (s.sys || []) : s.l,
        mode: s.m ? 1 : 0,
      });
    }
    perfMark('name-index-ready');
    document.getElementById('status').textContent = '列車データを展開中...';

    // Worker が組み立てた配列を受け取る。Worker が使えない/コケた場合だけ自前でやる。
    let built = null;
    if (binWorker) {
      try {
        built = await binWorker.build(meta, graph.stations.length);
      } catch (e) {
        console.warn('Worker での構築に失敗。メインスレッドでやり直します:', e);
      }
      // 用済み。配列は transfer 済みなので、ここで畳んでもデータは失わない。
      binWorker.terminate();
    }
    perfMark('bin-ready');
    if (built) {
      RouterV3.adoptBuild(built, meta, graph.stations, fares);
    } else {
      // フォールバック。Worker が取得済みでもHTTP/SWキャッシュに載っているので、
      // ここでの取り直しはほぼキャッシュ命中で済む。
      RouterV3.loadBinary(await fetchBin(DATA_URLS.bin), meta, graph.stations, fares);
    }
    perfMark('router-ready');

    const nTrips = meta.trips.l.length;
    const nBusStops = graph.stats.bus_stops || 0;
    const nBusTrips = (meta.trips.m || []).reduce((a, b) => a + b, 0);
    document.getElementById('badge').textContent = `${graph.stats.stations}駅`;
    document.getElementById('status').textContent =
      `${graph.stats.stations}駅` +
      (nBusStops ? ` + ${nBusStops.toLocaleString()}バス停` : '') +
      ` / ${(nTrips - nBusTrips).toLocaleString()}本の列車` +
      (nBusTrips ? ` + ${nBusTrips.toLocaleString()}便のバス` : '') +
      ` / オフライン対応`;
    renderCredits(meta.sources);
    document.getElementById('search-btn').disabled = false;
    perfMark('searchable');
    console.log(`CSA loaded: ${RouterV3.data.nConn} connections, ${nTrips} trips`);
    initAutocomplete();
    // のりばデータは検索可能になった後に取りに行く(初期ロードをブロックしない)
    fetchJson(PLATFORMS_URL)
      .then(d => { platformData = d; })
      .catch(e => console.warn('のりばデータを読み込めませんでした:', e));
    applyUrlParams();   // 外部アプリ(map-app等)からの ?from=&to=&t=&d= deep-link
    // SWに実URLを伝えて取りこぼしを埋めさせる。sw.js の DATA と ?v= がズレていても
    // オンラインで一度開けばここで正しいURLがキャッシュされ、次からオフラインで動く。
    notifySwOfDataUrls();
  } catch (e) {
    console.error('データ読み込み失敗:', e);
    showLoadError(e);
  }
}

// SWに「今このページが実際に使ったURL」を伝えてオフライン用に保存させる。
//
// 初回訪問ではまだ controller が無い(SWがページを制御していない)。旧実装はそこで
// 諦めていたので、初回はSW側のプリキャッシュに頼るしかなく、同じ11MBをページとSWで
// 二重にダウンロードしていた。ready を待って active に直接送れば初回から届くので、
// SW側は「ページが取り終わったあとに」HTTPキャッシュから拾い直すだけで済む。
function notifySwOfDataUrls() {
  if (!navigator.serviceWorker) return;
  const urls = Object.values(DATA_URLS).concat([PLATFORMS_URL]);
  const send = sw => sw && sw.postMessage({ type: 'CACHE_URLS', urls });
  if (navigator.serviceWorker.controller) { send(navigator.serviceWorker.controller); return; }
  navigator.serviceWorker.ready.then(reg => send(reg.active)).catch(() => {});
}

// 読み込みに失敗したまま何も出来なくなるのが一番困るので、必ず復旧手段を出す。
// 旧実装はエラー文字列を表示するだけで、検索ボタンが無効のまま復旧不能だった。
function showLoadError(e) {
  const el = document.getElementById('status');
  const offline = !navigator.onLine;
  el.style.color = '#dc2626';
  el.textContent = offline
    ? 'オフラインで、保存済みデータが見つかりません。'
    : 'データ読み込みエラー: ' + e.message;

  const bar = document.createElement('span');
  bar.style.marginLeft = '8px';

  const retry = document.createElement('button');
  retry.textContent = '再読み込み';
  retry.onclick = () => {
    el.style.color = '';
    el.textContent = 'データ読み込み中...';
    bar.remove();
    loadData();
  };
  bar.appendChild(retry);

  // キャッシュが壊れている(HTMLが混入した等)ケースは、取り直さないと直らない。
  if (navigator.onLine && navigator.serviceWorker && navigator.serviceWorker.controller) {
    const rebuild = document.createElement('button');
    rebuild.textContent = 'データを取り直す';
    rebuild.style.marginLeft = '6px';
    rebuild.onclick = () => {
      rebuild.disabled = true;
      retry.disabled = true;
      el.textContent = 'データを取り直しています...';
      const ch = new MessageChannel();
      ch.port1.onmessage = ev => {
        bar.remove();
        el.style.color = '';
        if (ev.data && ev.data.missing && ev.data.missing.length) {
          showLoadError(new Error('取得できませんでした: ' + ev.data.missing.join(', ')));
        } else {
          loadData();
        }
      };
      navigator.serviceWorker.controller.postMessage(
        { type: 'RECACHE', urls: Object.values(DATA_URLS) }, [ch.port2]);
    };
    bar.appendChild(rebuild);
  }
  el.appendChild(bar);
}

loadData();

// === 出典表示 ===
// CC BY 4.0 等は「クレジット表示」がライセンス条件なので、同梱した外部データの
// 出典・ライセンスを必ず画面に出す。内容は make_trains_v3.py が meta.sources に書く。
function renderCredits(sources) {
  const el = document.getElementById('credits');
  if (!el) return;
  const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const all = Object.values(sources || {});
  if (!all.length) { el.innerHTML = ''; return; }
  // 300近いフィードを常時ベタ書きすると本文が埋まるので、都道府県ごとに畳んで
  // <details> に入れる。CC BY の表示義務は「開けば全件見える」で満たす。
  const line = s => {
    const name = s.catalog
      ? `<a href="${esc(s.catalog)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name);
    const lic = s.license_url
      ? `<a href="${esc(s.license_url)}" target="_blank" rel="noopener">${esc(s.license)}</a>` : esc(s.license);
    const days = s.rep_days
      ? Object.entries(s.rep_days).map(([k, v]) => `${k} ${v}`).join('/') : '';
    return `${name}: ${esc(s.attribution)} (${lic})` +
      (days ? ` <span style="opacity:.7">ダイヤ基準日 ${esc(days)}</span>` : '');
  };
  const byPref = new Map();
  for (const s of all) {
    const p = s.pref || 'その他';
    if (!byPref.has(p)) byPref.set(p, []);
    byPref.get(p).push(s);
  }
  const groups = [...byPref.entries()].map(([p, ss]) =>
    `<div><b>${esc(p)}</b> — ${ss.map(line).join(' ／ ')}</div>`).join('');
  el.innerHTML =
    `<details><summary>バスデータ出典 — ${all.length}フィード / ${byPref.size}都道府県` +
    `(CC BY・CC0。クリックで全件)</summary>${groups}</details>` +
    'バス区間の運賃は計算対象外です。';
}

// === Autocomplete ===
// かな比較用: カタカナをひらがなへ畳む(ひらがな/カタカナどちらでも引けるように)
function foldKana(s) {
  let out = '';
  for (const ch of s) {
    const c = ch.charCodeAt(0);
    out += (c >= 0x30A1 && c <= 0x30F6) ? String.fromCharCode(c - 0x60) : ch;
  }
  return out;
}
// 英字比較用: 小文字化し、長音符号(Tōkyō の ō 等)を素の母音へ畳む
function foldLatin(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
// ローマ字→ひらがな変換テーブル(ヘボン式・訓令式の両つづりを受ける)
const ROMA_TABLE = {
  a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お',
  ka: 'か', ki: 'き', ku: 'く', ke: 'け', ko: 'こ',
  sa: 'さ', si: 'し', shi: 'し', su: 'す', se: 'せ', so: 'そ',
  ta: 'た', ti: 'ち', chi: 'ち', tu: 'つ', tsu: 'つ', te: 'て', to: 'と',
  na: 'な', ni: 'に', nu: 'ぬ', ne: 'ね', no: 'の',
  ha: 'は', hi: 'ひ', hu: 'ふ', fu: 'ふ', he: 'へ', ho: 'ほ',
  ma: 'ま', mi: 'み', mu: 'む', me: 'め', mo: 'も',
  ya: 'や', yu: 'ゆ', yo: 'よ',
  ra: 'ら', ri: 'り', ru: 'る', re: 'れ', ro: 'ろ',
  wa: 'わ', wo: 'を',
  ga: 'が', gi: 'ぎ', gu: 'ぐ', ge: 'げ', go: 'ご',
  za: 'ざ', zi: 'じ', ji: 'じ', zu: 'ず', ze: 'ぜ', zo: 'ぞ',
  da: 'だ', di: 'ぢ', du: 'づ', de: 'で', do: 'ど',
  ba: 'ば', bi: 'び', bu: 'ぶ', be: 'べ', bo: 'ぼ',
  pa: 'ぱ', pi: 'ぴ', pu: 'ぷ', pe: 'ぺ', po: 'ぽ',
  kya: 'きゃ', kyu: 'きゅ', kyo: 'きょ',
  sha: 'しゃ', shu: 'しゅ', sho: 'しょ', sya: 'しゃ', syu: 'しゅ', syo: 'しょ',
  cha: 'ちゃ', chu: 'ちゅ', cho: 'ちょ', tya: 'ちゃ', tyu: 'ちゅ', tyo: 'ちょ',
  ja: 'じゃ', ju: 'じゅ', jo: 'じょ',
  jya: 'じゃ', jyu: 'じゅ', jyo: 'じょ', zya: 'じゃ', zyu: 'じゅ', zyo: 'じょ',
  nya: 'にゃ', nyu: 'にゅ', nyo: 'にょ',
  hya: 'ひゃ', hyu: 'ひゅ', hyo: 'ひょ',
  mya: 'みゃ', myu: 'みゅ', myo: 'みょ',
  rya: 'りゃ', ryu: 'りゅ', ryo: 'りょ',
  gya: 'ぎゃ', gyu: 'ぎゅ', gyo: 'ぎょ',
  bya: 'びゃ', byu: 'びゅ', byo: 'びょ',
  pya: 'ぴゃ', pyu: 'ぴゅ', pyo: 'ぴょ',
  fa: 'ふぁ', fi: 'ふぃ', fe: 'ふぇ', fo: 'ふぉ',
  va: 'ゔぁ', vi: 'ゔぃ', vu: 'ゔ', ve: 'ゔぇ', vo: 'ゔぉ',
  she: 'しぇ', che: 'ちぇ', je: 'じぇ',
  '-': 'ー',
};
// ローマ字入力の未確定文字列をひらがなへ。IME式(toukyou)や途中まで(kitam)でも
// 駅が引けるようにする。ローマ字として読めない文字列は '' を返す。
function romaToKana(q) {
  if (!/^[a-z-]+$/.test(q)) return '';
  let out = '', i = 0;
  while (i < q.length) {
    // 促音: n 以外の子音の連続 (kk, tt, ...)
    if (i + 1 < q.length && q[i] === q[i + 1] &&
        'bcdfghjkmpqrstvwyz'.includes(q[i])) {
      out += 'っ'; i++; continue;
    }
    // 撥音: nn / n+子音 / 末尾の n
    if (q[i] === 'n' && (i + 1 >= q.length || !'aiueoy'.includes(q[i + 1]))) {
      out += 'ん'; i += (q[i + 1] === 'n') ? 2 : 1; continue;
    }
    let hit = '';
    for (const l of [3, 2, 1]) {
      const seg = q.slice(i, i + l);
      if (ROMA_TABLE[seg]) { hit = ROMA_TABLE[seg]; i += l; break; }
    }
    if (hit) { out += hit; continue; }
    // 末尾の打ちかけ子音(kitam の m)は無視。途中で読めなければローマ字ではない
    return i >= q.length - 2 ? out : '';
  }
  return out;
}

// 駅名の表記ゆれ吸収。データ側は全角で持っている駅があり(羽田空港第１・第２ターミナル、
// 成田空港(空港第２ビル)、札幌(ＪＲ)、ＪＲ淡路 ほか鉄道66駅)、素の includes/=== だと
// 利用者が半角で打った瞬間に0件になる。羽田は「羽田空港第2ターミナル」と打つのが自然で、
// ?from=羽田空港第2ターミナル のディープリンクも同じ理由で外れていた。
// 全角英数を半角に畳んで小文字化するだけに留める(この範囲なら別駅どうしが衝突しない
// ことを全9,901駅で確認済み。かな⇄カナまで畳むと 丸の内/丸ノ内 のような別駅が混ざる)。
function normName(s) {
  return (s || '')
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .toLowerCase();
}

function searchStations(query) {
  if (!graph || query.length < 1) return [];
  const q = foldLatin(query);      // 英字名(e)との比較用
  const qKana = foldKana(query);   // かな読み(r)との比較用
  const qRoma = romaToKana(q);     // ローマ字入力をかなに変換して読みとも比較する
  const nq = normName(query);      // 表記(n)との比較用(全角/半角ゆれを吸収)
  const results = [];
  // 全マッチを集めてからソート。先頭で打ち切ると完全一致(例:新潟)が
  // 部分一致(新潟大学前/東新潟/X(新潟)…)に押し出されて永久に出ない不具合になる。
  for (const s of graph._nameIndex) {
    if (s.norm.includes(nq) || s.nameEn.includes(q) ||
        s.kana.includes(qKana) || (qRoma && s.kana.includes(qRoma))) {
      results.push(s);
    }
  }
  // 関連度: 完全一致(2) > 前方一致(1) > 部分一致(0)。表記・英字・かな・ローマ字の
  // どの経路で当たっても同格に扱う
  const rank = s =>
    (s.norm === nq || s.nameEn === q || s.kana === qKana ||
     (qRoma && s.kana === qRoma)) ? 2 :
    (s.norm.startsWith(nq) || (q && s.nameEn.startsWith(q)) ||
     s.kana.startsWith(qKana) || (qRoma && s.kana.startsWith(qRoma))) ? 1 : 0;
  for (const s of results) s._rank = rank(s);
  results.sort((a, b) => {
    if (a._rank !== b._rank) return b._rank - a._rank;
    // 同じ関連度なら鉄道駅を上に。バス停は数が多く、駅名サジェストを汚しやすい。
    // バス限定モードのときは探しているのが停留所なので順序を反転する
    if (a.mode !== b.mode) return travelMode === 'bus' ? b.mode - a.mode : a.mode - b.mode;
    return a.name.length - b.name.length;
  });
  return results.slice(0, 12);
}

function initAutocomplete() {
  document.querySelectorAll('.field-row').forEach(setupFieldAC);
}

// サジェストは position:absolute で浮くので、そのままだと真下の入力欄(出発欄を
// 打っているときの到着欄など)や検索ボタンを完全に覆ってしまう。覆われた到着欄を
// タップすると、実際に触れているのは候補(.ac-item)なので mousedown の
// preventDefault がフォーカス移動ごと打ち消し、「到着欄をタップしたのに出発欄に
// フォーカスが戻る(しかも出発駅が勝手に書き換わる)」ように見えていた。
// 表示中は行の下に候補リストぶんの余白を確保して、他の操作対象を隠さないようにする。
const AC_GAP = 12;  // dropdown の margin-top(4px) + 行間(8px)
function showDropdown(row, dropdown) {
  dropdown.classList.add('show');
  if (row && row.style) row.style.marginBottom = (dropdown.offsetHeight + AC_GAP) + 'px';
}
function hideDropdown(row, dropdown) {
  dropdown.classList.remove('show');
  if (row && row.style) row.style.marginBottom = '';
}

function setupFieldAC(row) {
  const input = row.querySelector('input');
  const dropdown = row.querySelector('.ac-dropdown');
  if (!input || !dropdown) return;

  const fieldId = input.closest('.field-row').dataset.role + '-' +
    Array.from(document.querySelectorAll('.field-row')).indexOf(input.closest('.field-row'));

  input.dataset.fieldId = fieldId;

  input.addEventListener('input', () => {
    delete selectedStations[input.dataset.fieldId];
    const results = searchStations(input.value);
    if (results.length === 0 || !input.value) {
      hideDropdown(row, dropdown);
      return;
    }
    dropdown.innerHTML = results.map(s => `
      <div class="ac-item" data-id="${s.id}">
        <div>
          <div class="ac-name">${s.mode === 1 ? '&#128652; ' : ''}${s.name}</div>
          <div class="ac-sub">${s.mode === 1 ? 'バス停 / ' : ''}${s.pref ? s.pref + ' / ' : ''}${s.lines.length ? s.lines[0] : ''}</div>
        </div>
      </div>
    `).join('');
    showDropdown(row, dropdown);

    dropdown.querySelectorAll('.ac-item').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const id = parseInt(el.dataset.id);
        input.value = graph.stations[id].n;
        selectedStations[input.dataset.fieldId] = id;
        hideDropdown(row, dropdown);
      });
    });
  });

  // 他の欄にフォーカスが移ったら、その欄の候補と入れ替わりで閉じる。
  // 閉じるのを遅らせているのは、候補タップ(mousedown → blur → click)の途中で
  // リストを消してしまわないため。
  input.addEventListener('blur', () => {
    setTimeout(() => hideDropdown(row, dropdown), 150);
  });
}

// === Via Stations ===
let viaCount = 0;
function addVia() {
  if (viaCount >= 3) return;

function removeVia(btn) {
  const row = btn.closest('.field-row');

  }

function clearField(btn) {
  const input = btn.previousElementSibling;
  input.value = '';
  if (input.dataset.fieldId) delete selectedStations[input.dataset.fieldId];
  input.focus();
}

function swapDepArr() {
  const rows = document.querySelectorAll('.field-row');
  const depRow = rows[0];
  const arrRow = rows[rows.length - 1];
  const depInput = depRow.querySelector('input');
  const arrInput = arrRow.querySelector('input');
  const tmpVal = depInput.value;
  const tmpId = selectedStations[depInput.dataset.fieldId];
  depInput.value = arrInput.value;
  selectedStations[depInput.dataset.fieldId] = selectedStations[arrInput.dataset.fieldId];
  arrInput.value = tmpVal;
  selectedStations[arrInput.dataset.fieldId] = tmpId;
}

// Find all station IDs matching a name exactly
function findAllByName(name) {
  // normName で全角/半角を畳んでから比較する。データ側が全角の駅(羽田空港第１ターミナル、
  // 成田空港(空港第２ビル)、ＪＲ淡路 等)は、素の === だと半角入力・ディープリンクで
  // 一切引けなかった。畳んでも別駅どうしが衝突しないことは全駅で確認済み。
  const strip = s => normName(s).replace(/[（(].*?[）)]/g, '');
  const target = normName(name), targetStrip = strip(name);
  const exact = [], loose = [];
  for (let i = 0; i < graph.stations.length; i++) {
    const n = graph.stations[i].n;
    if (normName(n) === target) exact.push(i);
    else if (strip(n) === targetStrip) loose.push(i);   // 札幌(ＪＲ) 等の括弧サフィックス
  }
  // 同名の鉄道駅とバス停が両方ある場合(新橋・九段下等 71件)は鉄道駅だけを起終点にする。
  // バス停側へは徒歩連絡で届くので、候補を増やして検索回数を倍にする価値がない。
  // 完全一致の中だけで鉄道駅を選ぶと、鉄道駅名が括弧付きの駅(大手町(東京)/日本橋(東京)/
  // 早稲田(メトロ)/大曲(秋田) 等16件)が同名の都営バス停に隠れ、?from=大手町 のディープ
  // リンクや駅名直接入力がバス停に解決されてしまう。完全一致に無ければ括弧除去一致まで見る。
  // バス限定モードでは探しているのが停留所なので優先順位を反転する(searchStations と同じ)。
  const want = travelMode === 'bus' ? (i => graph.stations[i].m === 1)
                                    : (i => graph.stations[i].m !== 1);
  const exactWant = exact.filter(want);
  if (exactWant.length) return exactWant;
  const looseWant = loose.filter(want);
  if (looseWant.length) return looseWant;
  return exact.length ? exact : loose;
}

// 複数日ロールオーバー探索(router_v3 の query が当日+2日分の接続を辿る)導入後は、
// 宿泊を挟む超長距離(稚内→博多 等)も経路が引けるようになった(Issue #14)。
// それでも超長距離で経路が出ない場合は時刻表データ欠落の可能性が高いが、原因の
// 切り分け(どの区間で途切れているか)には区切り検索が有効なので、その案内だけ残す。
const OVERNIGHT_KM = 1200;
function overnightHint(fromId, toId) {
  const a = graph.stations[fromId], b = graph.stations[toId];
  if (!a || !b || a.la == null || b.la == null) return '';
  const km = RouterV3.haversineKm(a.la, a.lo, b.la, b.lo);
  if (km < OVERNIGHT_KM) return '';
  return `<div style="margin-top:8px;font-size:12px;color:var(--muted)">直線距離で約${Math.round(km)}kmあります。` +
    `検索は出発から3日分の乗り継ぎまで辿りますが、この距離では時刻表データの欠落で経路が組めていない可能性があります。` +
    `途中の主要駅(東京・新大阪・博多など)で区切って検索すると、どの区間が原因か切り分けられます。</div>`;
}

// === Search ===
// 交通手段モード: all=すべて / rail=鉄道のみ(バス除外) / bus=バスのみ(バス限定の経路案内)
let travelMode = 'all';
const TRAVEL_MODES = ['all', 'rail', 'bus'];
function setTravelMode(mode) {
  if (TRAVEL_MODES.indexOf(mode) < 0) mode = 'all';
  travelMode = mode;
  const btns = document.querySelectorAll('.mode-btn');
  for (const b of btns) {
    if (b.dataset.mode === mode) b.classList.add('on');
    else b.classList.remove('on');
  }
  // 特急/新幹線は鉄道の設定なので、バス限定のときは無効に見せる
  const ot = document.getElementById('opt-toggles');
  if (ot && ot.classList) {
    if (mode === 'bus') ot.classList.add('dim');
    else ot.classList.remove('dim');
  }
  updateRailUI();
  saveOpts();
}

// 鉄道の路線種別: all=全事業者 / jr=JRのみ / private=私鉄のみ(事業者の個別選択可)。
// 「鉄道のみ」モードの時だけ意味を持つ(すべて/バスのみでは非表示・不使用)
let railFilter = 'all';
const RAIL_FILTERS = ['all', 'jr', 'private'];
let selectedOps = new Set();   // 私鉄で絞り込む事業者名(空 = すべての私鉄)

function setRailFilter(f) {
  if (RAIL_FILTERS.indexOf(f) < 0) f = 'all';
  railFilter = f;
  for (const b of document.querySelectorAll('.rail-btn')) {
    if (b.dataset.rail === f) b.classList.add('on');
    else b.classList.remove('on');
  }
  updateRailUI();
  saveOpts();
}
function updateRailUI() {
  const rt = document.getElementById('rail-toggles');
  const op = document.getElementById('op-picker');
  const railMode = travelMode === 'rail';
  if (rt) rt.hidden = !railMode;
  if (op) op.hidden = !(railMode && railFilter === 'private');
  if (railMode && railFilter === 'private') renderOpSummary();
}

// --- 私鉄の事業者選択(検索 or スクロールで選ぶ) ---
let opListCache = null;   // RouterV3.railOperators() の結果。データロード後に固定
function opList() {
  if (!opListCache) {
    try {
      if (RouterV3.data && RouterV3.data.lines) opListCache = RouterV3.railOperators();
    } catch (e) { opListCache = null; }
  }
  return opListCache || [];
}
function renderOpSummary() {
  const el = document.getElementById('op-summary');
  if (!el) return;
  if (!selectedOps.size) {
    el.innerHTML = '対象: <b>すべての私鉄</b> <span style="opacity:.7">— タップして会社を絞り込む</span>';
  } else {
    const names = Array.from(selectedOps);
    const head = names.slice(0, 3).join('・');
    el.innerHTML = `対象: <b>${head}${names.length > 3 ? ` ほか${names.length - 3}社` : ''}</b> <span style="opacity:.7">— タップして変更</span>`;
  }
}
function toggleOpList() {
  const w = document.getElementById('op-list-wrap');
  if (!w) return;
  w.hidden = !w.hidden;
  if (!w.hidden) renderOpList();
}
function renderOpList() {
  const box = document.getElementById('op-list');
  if (!box) return;
  const q = ((document.getElementById('op-search') || {}).value || '').trim();
  const list = opList();
  if (!list.length) {
    box.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--muted)">データ読み込み後に表示されます</div>';
    return;
  }
  const items = q ? list.filter(o => o.name.includes(q)) : list;
  box.innerHTML = items.map(o =>
    `<label class="op-item"><input type="checkbox" ${selectedOps.has(o.name) ? 'checked' : ''} onchange="toggleOp(this.dataset.op, this.checked)" data-op="${o.name}">${o.name}<span class="cnt">${o.lines}路線</span></label>`
  ).join('') || '<div style="padding:10px;font-size:12px;color:var(--muted)">該当する事業者がありません</div>';
}
function toggleOp(name, on) {
  if (on) selectedOps.add(name); else selectedOps.delete(name);
  renderOpSummary();
  saveOpts();
}
function clearOps() {
  selectedOps.clear();
  renderOpList(); renderOpSummary(); saveOpts();
}
// 座席種別(指定席/自由席)。運賃の乗車券部分は変わらず特急料金だけが変わるので、
// 再検索は不要で表示の作り直しだけでよい。
function currentSeat() {
  const el = document.getElementById('opt-seat');
  return el && el.value === 'nonreserved' ? 'nonreserved' : 'reserved';
}
function setSeat(v) {
  const el = document.getElementById('opt-seat');
  if (el) el.value = v === 'nonreserved' ? 'nonreserved' : 'reserved';
  saveOpts();
  // 運賃キャッシュ(安い順ソート用)は席種込みなので捨てる
  for (const j of allFoundRoutes) j._fare = null;
  // 予算指定中は席種で予算内/超過の判定が変わる(自由席なら収まる経路がある)ので、
  // 表示の作り直しでは足りず再検索する。
  if (allFoundRoutes.length) {
    if (currentBudget() != null) doSearch();
    else renderRoutes();
  }
}
// 予算(運賃上限・円)。未入力/0/不正値は「上限なし」= null。
// 席種と違って候補の出し方そのものが変わる(安い候補の追加・予算超過の除外)ので、
// 変更したら再検索する。
function currentBudget() {
  const el = document.getElementById('opt-budget');
  if (!el) return null;
  const n = parseInt(String(el.value).replace(/[^\d]/g, ''), 10);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function setBudget(v) {
  const el = document.getElementById('opt-budget');
  const n = parseInt(String(v == null ? '' : v).replace(/[^\d]/g, ''), 10);
  if (el) el.value = Number.isFinite(n) && n > 0 ? String(n) : '';
  saveOpts();
  if (allFoundRoutes.length) doSearch();   // 予算は探索条件なので再検索が要る
}
function saveOpts() {
  localStorage.setItem('routeOpts', JSON.stringify({
    express: document.getElementById('opt-express').checked,
    shinkansen: document.getElementById('opt-shinkansen').checked,
    seat: currentSeat(),
    budget: currentBudget(),
    mode: travelMode,
    rail: railFilter,
    ops: Array.from(selectedOps),
  }));
}
(function restoreOpts() {
  try {
    const o = JSON.parse(localStorage.getItem('routeOpts') || '{}');
    if (o.express === false) document.getElementById('opt-express').checked = false;
    if (o.shinkansen === false) document.getElementById('opt-shinkansen').checked = false;
    if (o.seat === 'nonreserved') document.getElementById('opt-seat').value = 'nonreserved';
    if (o.budget > 0) document.getElementById('opt-budget').value = String(o.budget);
    // 事業者絞り込みは railFilter より先に戻す(setRailFilter がサマリを描くため)
    if (Array.isArray(o.ops)) selectedOps = new Set(o.ops.filter(x => typeof x === 'string'));
    if (RAIL_FILTERS.indexOf(o.rail) >= 0 && o.rail !== 'all') setRailFilter(o.rail);
    // mode 導入前の保存値(bus:false = バスを使わない)からの移行
    const mode = o.mode || (o.bus === false ? 'rail' : null);
    if (mode) setTravelMode(mode);
  } catch (e) {}
})();

// === Deep-link 入口 ===
// 外部(map-appのtransit案内 等)から ?from=駅名&to=駅名[&t=HH:MM][&d=YYYY-MM-DD][&budget=円]
// で起動された場合、出発/到着欄に流し込んで自動検索する。駅名照合は doSearch の既存ロジックに委ねる。
function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  const from = (p.get('from') || '').trim();
  const to   = (p.get('to')   || '').trim();
  if (!from && !to) return;
  const depInput = document.querySelector('[data-role="dep"] input');
  const arrInput = document.querySelector('[data-role="arr"] input');
  if (depInput && from) { depInput.value = from; delete selectedStations[depInput.dataset.fieldId]; }
  if (arrInput && to)   { arrInput.value = to;   delete selectedStations[arrInput.dataset.fieldId]; }
  const t = (p.get('t') || '').trim().replace(':', '');
  if (/^\d{3,4}$/.test(t)) {
    const hh = t.length === 3 ? '0' + t.slice(0, 1) : t.slice(0, 2);
    const mm = t.slice(-2);
    const ti = document.getElementById('time-input'); if (ti) ti.value = hh + ':' + mm;
    const tt = document.getElementById('time-type');  if (tt) tt.value = 'dep';
  }
  const d = (p.get('d') || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) {
    const di = document.getElementById('date-input'); if (di) di.value = d;
  }
  // ?budget=3000 で予算(運賃上限)付きの案内に直行できる
  const budget = (p.get('budget') || '').trim();
  if (/^\d+$/.test(budget)) {
    const el = document.getElementById('opt-budget');
    if (el) el.value = String(parseInt(budget, 10) || '');
  }
  // ?mode=bus でバス限定の案内に直行できる(map-app の「バスで行く」導線用)
  const mode = (p.get('mode') || '').trim();
  if (TRAVEL_MODES.indexOf(mode) >= 0) setTravelMode(mode);
  // ?rail=jr|private (&ops=東急,京王) で路線種別/事業者を絞った検索に直行できる
  const rail = (p.get('rail') || '').trim();
  if (RAIL_FILTERS.indexOf(rail) >= 0) {
    setTravelMode('rail');
    const ops = (p.get('ops') || '').split(',').map(s => s.trim()).filter(Boolean);
    if (ops.length) selectedOps = new Set(ops);
    setRailFilter(rail);
  }
  if (from && to) setTimeout(doSearch, 0);
}

function doSearch() {
  const rows = document.querySelectorAll('.field-row');
  const waypointCandidates = [];

  for (const row of rows) {
    const input = row.querySelector('input');
    const fid = input.dataset.fieldId;
    const sid = selectedStations[fid];

    if (sid === undefined || sid === null) {
      const text = input.value.trim();
      if (!text) {
        if (row.dataset.role !== 'via') {
          alert(row.dataset.role === 'dep' ? '出発駅を選択してください' : '到着駅を選択してください');
          return;
        }
        continue;
      }
      const allIds = findAllByName(text);
      if (allIds.length > 0) {
        waypointCandidates.push(allIds);
      } else {
        const matches = searchStations(text);
        if (matches.length > 0) {
          const name = matches[0].name;
          waypointCandidates.push(findAllByName(name));
          input.value = name;
        } else {
          alert(`「${text}」が見つかりません`);
          return;
        }
      }
    } else {
      const name = graph.stations[sid].n;
      const allIds = findAllByName(name);
      waypointCandidates.push(allIds.length > 1 ? allIds : [sid]);
    }
  }

  if (waypointCandidates.length < 2) {
    alert('出発駅と到着駅を入力してください');
    return;
  }

  const st = getSearchTime();
  const opts = {
    express: document.getElementById('opt-express').checked,
    shinkansen: document.getElementById('opt-shinkansen').checked,
    seat: currentSeat(),             // 指定席/自由席(ランキングの運賃換算に効く)
    maxFare: currentBudget(),        // 予算(運賃上限・円)。null なら上限なし
    noBus: travelMode === 'rail',    // 鉄道のみ
    busOnly: travelMode === 'bus',   // バス限定
    // 路線種別(JR/私鉄)と事業者絞り込み。鉄道のみモードの時だけ効かせる
    rail: travelMode === 'rail' && railFilter !== 'all' ? railFilter : undefined,
    operators: travelMode === 'rail' && railFilter === 'private' && selectedOps.size
      ? Array.from(selectedOps) : undefined,
    day: getDayType(),               // 運転日フィルタ(0平日/1土/2休)
  };
  lastSearchOpts = opts;             // 前の便/次の便で再利用
  // 到着/出発の時刻指定を覚えておき、どのソートモードでも第2キーとして
  // 「指定時刻に近い順」を効かせる(now指定=時刻未指定のときは効かせない)
  searchTimeCtx = st.explicit
    ? { type: st.type, minutes: st.minutes }
    : null;

  // 到着指定: 指定時刻までに着く最遅出発を二分探索
  function latestDeparture(f, t, arrBy) {
    let lo = arrBy - 480, hi = arrBy, best = null;
    const ok = j => j && j.arr <= arrBy;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      const j = RouterV3.query(f, t, mid, opts);
      if (ok(j)) { best = j; lo = j.dep > mid ? j.dep : mid; }
      else hi = mid;
      if (best && best.dep === lo && lo + 1 >= hi) break;
    }
    return best;
  }

  if (waypointCandidates.length === 2) {
    let journeys = [];
    const sigs = new Set();
    for (const fid of waypointCandidates[0]) {
      for (const tid of waypointCandidates[1]) {
        if (fid === tid) continue;
        let found;
        if (st.type === 'arr') {
          // 締切までに着く最遅出発を求め、その手前の窓から多様な経路を出して
          // 締切以内のものを残す(到着指定でも複数経路を提示)
          const jl = RouterV3.annotateBudget(latestDeparture(fid, tid, st.minutes), opts);
          if (jl) {
            const cands = RouterV3.findJourneys(fid, tid, Math.max(0, jl.dep - 90), opts)
              .filter(j => j.arr <= st.minutes);
            found = [jl, ...cands];   // 最遅出発便は必ず含める(多様化窓の外に出るため)
          } else {
            found = [];
          }
        } else {
          found = RouterV3.findJourneys(fid, tid, st.minutes, opts);
        }
        for (const j of found) {
          const sig = j.dep + '|' + j.arr + '|' +
            j.legs.map(l => l.kind === 'ride' ? l.line + l.dep : 'w').join('>');
          if (!sigs.has(sig)) { sigs.add(sig); journeys.push(j); }
        }
      }
    }
    // 予算フィルタ(同名駅の候補をまたいだ後の最終段)。findJourneys は駅ペアごとに
    // 篩っているので、あるペアでは全滅・別のペアでは予算内、という混在が起きうる。
    // ここでも「予算内が1本でもあれば超過は落とす」に揃える。
    if (opts.maxFare != null) {
      for (const j of journeys) RouterV3.annotateBudget(j, opts);
      const within = journeys.filter(j => !j.budget.over);
      if (within.length) journeys = within;
    }
    journeys.sort((a, b) => {
      if (st.type === 'arr') {
        if (Math.abs(b.dep - a.dep) > 5) return b.dep - a.dep; // 遅く出る方
      }
      if (Math.abs(a.arr - b.arr) > 5) return a.arr - b.arr;
      if (Math.abs(b.dep - a.dep) > 5) return b.dep - a.dep;
      return a.transfers - b.transfers;
    });
    if (!journeys.length) {
      const fn = graph.stations[waypointCandidates[0][0]].n;
      const tn = graph.stations[waypointCandidates[1][0]].n;
      // 特急/新幹線OFFだと長距離は各停のみで日を跨ぎ探索不能になる→ヒント。
      // バス限定は「そもそも収録範囲外」が最も多いので、そちらのヒントを優先する。
      const offHint = opts.busOnly
        ? `<div style="margin-top:8px;font-size:12px;color:var(--muted)">バスのみで検索しています。収録しているのは都営バスだけなので、営業エリア(東京23区と多摩の一部)の外や、駅から停留所への徒歩連絡が無い場所では経路が出ません。「すべて」に戻してお試しください。</div>`
        : (opts.rail || opts.operators)
        ? `<div style="margin-top:8px;font-size:12px;color:var(--muted)">${
            opts.operators ? '選択した事業者の路線だけ' : opts.rail === 'jr' ? 'JRの路線だけ' : '私鉄の路線だけ'
          }で検索しています。この区間は絞り込みの範囲内では乗り継げないようです。「全事業者」に戻すか、選択する会社を増やしてお試しください。</div>`
        : (!opts.express || !opts.shinkansen)
        ? `<div style="margin-top:8px;font-size:12px;color:var(--muted)">特急・新幹線をOFFにしています。長距離は各駅停車のみだと日付をまたぐため経路が出ないことがあります。トグルをONにしてお試しください。</div>`
        : opts.maxFare != null
        ? `<div style="margin-top:8px;font-size:12px;color:var(--muted)">予算¥${opts.maxFare.toLocaleString()}以内で検索しています。予算欄を空にするか金額を上げてお試しください。</div>`
        : overnightHint(waypointCandidates[0][0], waypointCandidates[1][0]);
      document.getElementById('results').innerHTML =
        `<div class="no-route">${fn} → ${tn} の経路が見つかりません${offHint}</div>`;
      return;
    }
    renderMultipleResults(journeys, true);
  } else {
    // 経由駅: 区間ごとに最早到着を連結
    let combined = null;
    let depMin = st.minutes;
    for (let i = 0; i < waypointCandidates.length - 1; i++) {
      let best = null;
      for (const fid of waypointCandidates[i]) {
        for (const tid of waypointCandidates[i + 1]) {
          if (fid === tid) continue;
          const j = RouterV3.query(fid, tid, depMin, opts);
          if (j && (!best || j.arr < best.arr)) best = j;
        }
      }
      if (!best) {
        document.getElementById('results').innerHTML =
          `<div class="no-route">経路が見つかりません</div>`;
        return;
      }
      if (!combined) combined = best;
      else {
        combined.legs.push(...best.legs);
        combined.arr = best.arr;
        combined.transfers += best.transfers + 1;
      }
      depMin = best.arr + 4;
    }
    // 経由指定は区間ごとに最早到着を連結するだけで候補を並べないため、予算での
    // 絞り込みはできない。総額だけ判定して超過なら警告表示にする。
    RouterV3.annotateBudget(combined, opts);
    renderMultipleResults([combined], false);  // 経由指定は始発・終電の対象外
  }
}

function formatTime(minutes) {
  const h = Math.floor(minutes / 60) % 24;
  const m = minutes % 60;
  // 日跨ぎ(複数日ロールオーバー探索)の時刻は「翌」「2日後」を付けて区別する。
  // 従来も深夜帯複製で最大30:00(=翌06:00)までは素の時計時刻で出していたが、
  // 宿泊を挟む経路が出るようになったので日数を明示しないと誤解する。
  const day = Math.floor(minutes / 1440);
  const mark = day >= 2 ? `${day}日後` : day === 1 ? '翌' : '';
  return `${mark}${String(h).padStart(2,'0')}:${String(Math.round(m)).padStart(2,'0')}`;
}

function getSearchTime() {
  const type = document.getElementById('time-type').value;
  const timeInput = document.getElementById('time-input').value;

  if (type === 'now' || !timeInput) {
    const now = new Date();
    return { type: 'dep', minutes: now.getHours() * 60 + now.getMinutes(), explicit: false };
  }

  const [h, m] = timeInput.split(':').map(Number);
  return { type, minutes: h * 60 + m, explicit: true };
}

// Line color hash for visual distinction
const LINE_COLORS = [
  '#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c',
  '#0891b2', '#be185d', '#4f46e5', '#ca8a04', '#059669',
];
const BUS_COLOR = '#2e7d32';   // バスは路線色ハッシュを使わず専用色で統一する
// 表示用路線名(直通の誤ラベルを区間多数決で訂正したlineLabelを優先)
function dl(l) { return l.lineLabel || l.line; }
function lineColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = ((hash << 5) - hash + name.charCodeAt(i)) | 0;
  return LINE_COLORS[Math.abs(hash) % LINE_COLORS.length];
}
// legの表示色。バス(mode=1)は系統名でハッシュせずバス専用色にする
function legColor(l) { return l.mode === 1 ? BUS_COLOR : lineColor(dl(l)); }
const isBusLeg = l => l.mode === 1;

// === 予算(運賃上限)の表示 ===
// 判定は j.budget の max だけを使い、超過かどうかは「いま表示している運賃」で
// 計算し直す。席種を切り替えたときに検索時の判定が残って矛盾するのを避けるため。
function seatMinFare(fare) {
  if (!fare) return null;
  if (!fare.seatFares) return fare.total;
  return Math.min(fare.seatFares.reserved, fare.seatFares.nonreserved);
}
function budgetTagHtml(j, fare) {
  const b = j && j.budget;
  if (!b || b.max == null) return '';
  const yen = n => '¥' + n.toLocaleString();
  // バス絡みは鉄道運賃しか出せないので判定不能(¥0や過小評価で「予算内」と言わない)
  if (b.unknown || !(fare.total > 0)) {
    return `<div style="font-size:11px;color:var(--orange)">予算判定不可</div>`;
  }
  const min = seatMinFare(fare);
  if (min > b.max) {
    return `<div style="font-size:11px;color:var(--red);font-weight:600">予算超過 +${yen(min - b.max)}</div>`;
  }
  if (fare.total > b.max) {
    // 指定席では超過、自由席なら収まる(逆も同じ)。切替リンクは上の席種欄が出す。
    return `<div style="font-size:11px;color:var(--orange)">安い席種なら予算内 ${yen(min)}</div>`;
  }
  return `<div style="font-size:11px;color:var(--green)">予算内 (残り${yen(b.max - fare.total)})</div>`;
}
// 結果一覧の先頭に出す予算バナー。予算内が1本も無いときは理由と最安を示す。
function budgetBannerHtml(routes) {
  const withB = routes.filter(j => j.budget && j.budget.max != null);
  if (!withB.length) return '';
  const max = withB[0].budget.max;
  const judged = withB.filter(j => !j.budget.unknown && j.budget.minFare != null);
  const yen = n => '¥' + n.toLocaleString();
  if (judged.length && judged.every(j => j.budget.over)) {
    const cheapest = Math.min.apply(null, judged.map(j => j.budget.minFare));
    return `<div style="margin:8px 12px 0;padding:10px 12px;border-radius:10px;
      background:#fef2f2;border:1px solid #fecaca;color:var(--red);font-size:13px;line-height:1.6">
      予算${yen(max)}以内の経路は見つかりませんでした。最安は${yen(cheapest)}(+${yen(cheapest - max)})です。<br>
      <span style="color:var(--muted)">予算を上げるか空欄にすると、ほかの経路も表示されます。</span></div>`;
  }
  // 「そのままで予算内」と「安い席種を選べば予算内」は分けて数える。
  // まとめると、指定席では全部超過なのに「予算内◯件」と出てしまう。
  const within = judged.filter(j => j.budget.fare <= max);
  const bySeat = judged.filter(j => j.budget.fare > max && j.budget.minFare <= max);
  if (!within.length && bySeat.length) {
    return `<div style="margin:8px 12px 0;padding:8px 12px;border-radius:10px;
      background:#fff7ed;border:1px solid #fed7aa;color:var(--orange);font-size:13px">
      予算${yen(max)}以内に収まるのは自由席を選んだ場合の${bySeat.length}件です</div>`;
  }
  return `<div style="margin:8px 12px 0;padding:8px 12px;border-radius:10px;
    background:#f0fdf4;border:1px solid #bbf7d0;color:var(--green);font-size:13px">
    予算${yen(max)}以内の経路 ${within.length}件${
      bySeat.length ? `<span style="color:var(--muted)"> (ほかに自由席なら予算内 ${bySeat.length}件)</span>` : ''}</div>`;
// のりば表示タグ。plat は "14" / "1・2" 等(platform_match.jsの推定結果)
function platTag(plat, kind) {
  if (!plat) return '';
  const label = (typeof PlatformMatch !== 'undefined' ? PlatformMatch.formatTrack(plat) : plat + '番線');
  const color = kind === 'dep' ? 'var(--blue)' : 'var(--muted)';
  return ` <span style="font-size:11px;font-weight:600;color:${color};background:#f1f5f9;border-radius:4px;padding:1px 5px;white-space:nowrap">${label}${kind === 'dep' ? '発' : '着'}</span>`;
}

// === Rendering (journey = RouterV3.findJourneys の結果) ===
function renderOneRoute(j, index) {
  // のりばデータが読み込み済みなら各legに乗車/降車ホームを付与
  if (platformData && RouterV3.attachPlatforms) {
    try { RouterV3.attachPlatforms(j, platformData); } catch (e) { console.warn('のりば付与失敗:', e); }
  }
  const depStr = formatTime(j.dep);
  const arrStr = formatTime(j.arr);
  const totalMin = j.arr - j.dep;
  const km = RouterV3.journeyKm(j);
  const fare = RouterV3.journeyFare(j, { seat: currentSeat() });
  const rides = j.legs.filter(l => l.kind === 'ride');
  const nBusRides = rides.filter(isBusLeg).length;

  const routeId = 'route-' + index;
  let html = `<div class="route-card" id="card-${index}">`;

  html += `<div class="route-summary" onclick="toggleRoute('${routeId}')" style="cursor:pointer">
    <div style="flex:1">
      <div style="font-size:20px;font-weight:700;color:var(--blue)">${depStr} → ${arrStr}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">${totalMin}分 / ${j.transfers > 0 ? j.transfers + '回乗換' : '直通'} / ${km.toFixed(1)}km${nBusRides ? ` / <span style="color:${BUS_COLOR};font-weight:600">&#128652; バス${nBusRides}回</span>` : ''}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:18px;font-weight:700;color:var(--text)">${
        // 全区間バスだと鉄道運賃の合計が0円になる。「¥0」は誤解を招くので出さない
        fare.total > 0 || !nBusRides
          ? `¥${fare.total.toLocaleString()}`
          : `<span style="font-size:13px;color:var(--muted)">運賃別途</span>`
      }</div>
      ${(() => {
        const ex = fare.breakdown.filter(b => /料金/.test(b.company)).reduce((a, b) => a + b.fare, 0);
        if (ex <= 0) return '';
        const sf = fare.seatFares;
        // 自由席のある列車を含むときだけ席種を出す。全車指定席(はやぶさ/あずさ等)は
        // 選択の余地が無いので従来どおり「うち特急料金」だけ。
        const seatLabel = sf ? (fare.seat === 'nonreserved' ? '自由席' : '指定席') : '';
        let h = `<div style="font-size:11px;color:var(--muted)">うち特急料金 ¥${ex.toLocaleString()}${seatLabel ? '(' + seatLabel + ')' : ''}</div>`;
        if (sf && sf.reserved !== sf.nonreserved) {
          const other = fare.seat === 'nonreserved'
            ? { key: 'reserved', label: '指定席', total: sf.reserved }
            : { key: 'nonreserved', label: '自由席', total: sf.nonreserved };
          const d = other.total - fare.total;
          h += `<div style="font-size:11px;margin-top:1px"><a href="#" onclick="event.stopPropagation();event.preventDefault();setSeat('${other.key}')" style="color:var(--blue)">${other.label} ¥${other.total.toLocaleString()} (${d > 0 ? '+' : ''}${d.toLocaleString()})</a></div>`;
        }
        return h;
      })()}
      ${nBusRides && fare.total > 0 ? `<div style="font-size:11px;color:var(--orange)">バス運賃別途</div>` : ''}
      ${budgetTagHtml(j, fare)}
    </div>
  </div>`;

  // 前の便 / 次の便 (この経路の発車時刻を1本ずらす)
  html += `<div style="display:flex;gap:8px;padding:2px 16px 8px">
    <button onclick="event.stopPropagation();shiftTrain(${index},-1)" style="flex:1;padding:7px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--blue);cursor:pointer">← 前の便</button>
    <button onclick="event.stopPropagation();shiftTrain(${index},1)" style="flex:1;padding:7px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--blue);cursor:pointer">次の便 →</button>
  </div>`;

  // Line summary bar
  const totalStops = rides.reduce((s, l) => s + l.stops.length - 1, 0) || 1;
  html += `<div style="display:flex;height:4px;margin:0 16px 8px;border-radius:2px;overflow:hidden">`;
  for (const l of rides) {
    const pct = ((l.stops.length - 1) / totalStops * 100).toFixed(1);
    html += `<div style="width:${pct}%;background:${legColor(l)}"></div>`;
  }
  html += `</div>`;

  const lineNames = rides.map(l =>
    `<span class="line-tag" style="background:${legColor(l)}11;color:${legColor(l)};margin:2px">${isBusLeg(l) ? '&#128652; ' : ''}${dl(l)}</span>`
  ).join('→');
  html += `<div style="padding:0 16px 10px;font-size:12px;line-height:1.8">${lineNames}</div>`;

  const collapsed = index > 0 ? ' collapsed' : '';
  html += `<div class="route-detail${collapsed}" id="${routeId}">`;

  let prevArr = null;
  let pendingArrPlat = null;   // 直前のride legの降車ホーム(次の駅名表示に添える)
  for (let li = 0; li < j.legs.length; li++) {
    const leg = j.legs[li];
    if (leg.kind === 'walk') {
      const fn = graph.stations[leg.from].n, tn = graph.stations[leg.to].n;
      html += `<div class="step">
        <div class="step-line"><div class="step-dot walk"></div><div class="step-bar walk"></div></div>
        <div class="step-content">
          <div class="step-station" style="font-size:13px">${fn}${platTag(pendingArrPlat, 'arr')} → ${tn}</div>
          <div class="step-info">徒歩 約${leg.min}分</div>
        </div>
      </div>`;
      pendingArrPlat = null;
      if (prevArr != null) prevArr += leg.min;
      continue;
    }
    const fromStn = graph.stations[leg.from], toStn = graph.stations[leg.to];
    const color = legColor(leg);
    const bus = isBusLeg(leg);
    const unit = bus ? '停留所' : '駅';
    const wait = prevArr != null ? leg.dep - prevArr : 0;
    const nMid = leg.stops.length - 2;   // 途中駅数(乗車駅・降車駅を除く)
    const stopsId = `stops-${index}-${li}`;
    // 途中停車駅リスト(時刻つき)。発時刻d優先、無ければ着時刻a。
    let midHtml = '';
    if (nMid > 0) {
      midHtml = `<div class="midstops collapsed" id="${stopsId}" style="margin-top:6px;border-left:2px solid ${color}44;padding-left:10px">`;
      for (let mi = 1; mi <= nMid; mi++) {
        const s = leg.stops[mi];
        const t = s.d != null ? s.d : s.a;
        const nm = graph.stations[s.st] ? graph.stations[s.st].n : '?';
        midHtml += `<div style="font-size:12px;color:var(--muted);padding:2px 0">
          <span style="display:inline-block;min-width:42px;color:var(--text)">${t != null ? formatTime(t) : '—'}</span>${nm}</div>`;
      }
      midHtml += `</div>`;
    }
    const stopsLabel = nMid > 0
      ? `<span onclick="event.stopPropagation();toggleStops('${stopsId}',this)" style="cursor:pointer;color:var(--blue);text-decoration:underline dotted">途中${nMid}${unit} ▾</span>`
      : `${leg.stops.length - 1}${unit}`;
    html += `<div class="step">
      <div class="step-line">
        <div class="step-dot" style="background:${color};box-shadow:0 0 0 2px ${color}"></div>
        <div class="step-bar" style="background:${color}"></div>
      </div>
      <div class="step-content">
        <div class="step-station"><span style="color:var(--muted);font-size:12px;margin-right:6px">${formatTime(leg.dep)}</span>${fromStn.n}${platTag(pendingArrPlat, 'arr')}${platTag(leg.depPlat, 'dep')}</div>
        <div class="step-info">
          <span class="line-tag" style="background:${color}11;color:${color}">${bus ? '&#128652; ' : ''}${dl(leg)}</span>
          ${leg.type ? `<span style="font-size:11px;color:var(--orange);font-weight:600">${leg.type}</span>` : ''}
          ${leg.dest ? `<span style="font-size:11px">${leg.dest}行</span>` : ''}
          ${stopsLabel} ${leg.arr - leg.dep}分${wait > 0 ? ` <span style="color:var(--orange)">(待${wait}分)</span>` : ''}
        </div>
        ${midHtml}
      </div>
    </div>`;
    prevArr = leg.arr;
    pendingArrPlat = leg.arrPlat || null;
  }
  const lastLeg = j.legs[j.legs.length - 1];
  const goalStn = graph.stations[lastLeg.to];
  html += `<div class="step">
    <div class="step-line"><div class="step-dot end"></div><div class="step-bar none"></div></div>
    <div class="step-content">
      <div class="step-station"><span style="color:var(--muted);font-size:12px;margin-right:6px">${formatTime(j.arr)}</span>${goalStn.n}${platTag(pendingArrPlat, 'arr')}</div>
      <div class="step-info">到着</div>
    </div>
  </div>`;

  html += `</div></div>`;
  return html;
}

let allFoundRoutes = [];
let lastSearchOpts = {};
let cachedFirstLast = null;    // その区間の始発・終電(直行検索時のみ算出)
let firstLastSrcDst = null;    // [src,dst] キャッシュのキー

// 始発/終電の案内バー。経由駅指定の検索時や算出前・算出不能時は非表示。
function firstLastBlockHtml() {
  if (!cachedFirstLast) return '';
  const { first, last } = cachedFirstLast;
  if (!first && !last) return '';
  if (!firstLastSrcDst) return '';
  const [src, dst] = firstLastSrcDst;
  const parts = [];
  const lastLabel = lastSearchOpts.busOnly ? '終バス' : '終電';
  if (first) parts.push(`始発 ${formatTime(first.dep)}発`);
  if (last) parts.push(`${lastLabel} ${formatTime(last.dep)}発`);
  return `<div style="margin:8px 16px;padding:8px 12px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted)">
    ${graph.stations[src].n} → ${graph.stations[dst].n}: ${parts.join(' / ')} <span style="opacity:.75">(目安)</span>
  </div>`;
}

// 軽量トースト(前後の便が無い時の通知)
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1600);
}

// 前の便(dir=-1)/次の便(dir=+1)に差し替え
function shiftTrain(index, dir) {
  const j = allFoundRoutes[index];
  if (!j || !j.legs || !j.legs.length) return;
  const src = j.legs[0].from;
  const dst = j.legs[j.legs.length - 1].to;
  const nj = dir > 0
    ? RouterV3.nextJourney(src, dst, j.dep, lastSearchOpts)
    : RouterV3.prevJourney(src, dst, j.dep, lastSearchOpts);
  if (!nj) {
    toast(dir > 0 ? 'これより後の便は見つかりません' : 'これより前の便は見つかりません');
    return;
  }
  allFoundRoutes[index] = nj;
  const card = document.getElementById('card-' + index);
  if (card) card.outerHTML = renderOneRoute(nj, index);
  const det = document.getElementById('route-' + index);
  if (det) det.classList.remove('collapsed');   // 差し替え後は展開表示
}

let currentSort = 'fast';   // fast=早い / cheap=安い / transfer=乗換少
let showAllRoutes = false;
let searchTimeCtx = null;   // 時刻指定検索時 {type:'arr'|'dep', minutes} / 未指定はnull

function fareOf(j) {         // 運賃をキャッシュ(ソート用)。席種を変えたら setSeat が捨てる
  if (j._fare == null) j._fare = RouterV3.journeyFare(j, { seat: currentSeat() }).total;
  return j._fare;
}
// 指定時刻(到着ならarr/出発ならdep)との差の絶対値。指定が近いほど小さい。
// 時刻未指定のときは0を返し、ソート順に影響を与えない。
function timeProximity(j) {
  if (!searchTimeCtx) return 0;
  const t = searchTimeCtx.type === 'arr' ? j.arr : j.dep;
  return Math.abs(t - searchTimeCtx.minutes);
}
// 第1キー(選択中のソートモードの基準)が同点のとき、指定時刻に近い順を
// 第2優先軸として挿入する。これにより早い順・安い順・乗換少のどれを選んでも、
// 第1キーが並ぶ帯の中では指定時刻(到着なら到着時刻・出発なら出発時刻)に最も
// 近い便が上位へ来る。第1キーの基準自体は従来のまま維持する。
// (comparator の推移律を保つため第1キーは量子化せず厳密比較のまま扱う)
const SORTERS = {
  fast: (a, b) => (a.arr - b.arr) || (timeProximity(a) - timeProximity(b)) || (a.transfers - b.transfers) || (b.dep - a.dep),
  cheap: (a, b) => (fareOf(a) - fareOf(b)) || (timeProximity(a) - timeProximity(b)) || (a.arr - b.arr) || (a.transfers - b.transfers),
  transfer: (a, b) => (a.transfers - b.transfers) || (timeProximity(a) - timeProximity(b)) || (a.arr - b.arr) || (fareOf(a) - fareOf(b)),
};
const SORT_LABELS = { fast: '早い順', cheap: '安い順', transfer: '乗換少' };

function setSort(key) {
  if (currentSort === key) return;
  currentSort = key;
  renderRoutes();
}

function sortBarHtml() {
  return `<div style="display:flex;gap:6px;padding:8px 12px 4px">` +
    Object.keys(SORT_LABELS).map(k => {
      const on = currentSort === k;
      return `<button onclick="setSort('${k}')" style="
        flex:1;padding:8px;border-radius:8px;font-size:13px;cursor:pointer;
        border:1px solid ${on ? 'var(--blue)' : 'var(--border)'};
        background:${on ? 'var(--blue)' : '#fff'};color:${on ? '#fff' : 'var(--text)'};
        font-weight:${on ? '600' : '400'}">${SORT_LABELS[k]}</button>`;
    }).join('') + `</div>`;
}

function renderRoutes() {
  const routes = allFoundRoutes;
  if (!routes.length) return;
  // 予算内が1本も無いときは既定の早い順ではなく安い順。「あといくら足りないか」が
  // わかる最安が先頭に来るほうが、予算を決め直す判断に使える。
  const allOverBudget = routes.every(j => j.budget && j.budget.over);
  routes.sort(allOverBudget ? SORTERS.cheap : (SORTERS[currentSort] || SORTERS.fast));
  const showCount = showAllRoutes ? routes.length : Math.min(3, routes.length);
  let html = `<div id="first-last-bar">${firstLastBlockHtml()}</div>`;
  html += budgetBannerHtml(routes);
  html += routes.length > 1 ? sortBarHtml() : '';
  if (routes.length > 1) {
    html += `<div style="padding:0 16px 0;font-size:13px;color:var(--muted)">${routes.length}件の経路</div>`;
  }
  for (let i = 0; i < showCount; i++) html += renderOneRoute(routes[i], i);
  if (routes.length > showCount) {
    html += `<button onclick="showMoreRoutes()" id="show-more-btn" style="
      width:calc(100% - 24px);margin:0 12px 12px;padding:12px;
      background:white;border:1px solid var(--border);border-radius:10px;
      font-size:14px;color:var(--blue);cursor:pointer;font-weight:500;
    ">さらに${routes.length - showCount}件表示</button>`;
  }
  document.getElementById('results').innerHTML = html;
}

// 始発・終電の計算は経路が多いと数百msかかることがあるため、結果表示を
// 先に済ませてから非同期(次のイベントループ)で算出しバーだけ差し替える。
function renderMultipleResults(routes, direct) {
  allFoundRoutes = routes;
  showAllRoutes = false;
  cachedFirstLast = null;
  firstLastSrcDst = null;
  renderRoutes();
  if (direct && routes.length) {
    const j = routes[0];
    const src = j.legs[0].from, dst = j.legs[j.legs.length - 1].to;
    setTimeout(() => {
      cachedFirstLast = RouterV3.firstLastOfDay(src, dst, lastSearchOpts);
      firstLastSrcDst = [src, dst];
      const bar = document.getElementById('first-last-bar');
      if (bar) bar.outerHTML = `<div id="first-last-bar">${firstLastBlockHtml()}</div>`;
    }, 0);
  }
}

function showMoreRoutes() {
  showAllRoutes = true;
  renderRoutes();
}

function toggleRoute(routeId) {
  const el = document.getElementById(routeId);
  if (!el) return;
  el.classList.toggle('collapsed');
}

// 途中駅リストの開閉(▾/▴)
function toggleStops(stopsId, labelEl) {
  const el = document.getElementById(stopsId);
  if (!el) return;
  const open = el.classList.toggle('collapsed') === false;
  if (labelEl) labelEl.innerHTML = labelEl.innerHTML.replace(open ? '▾' : '▴', open ? '▴' : '▾');
}

function toggleDetail() {
  // Legacy, kept for compatibility
}

// === Service Worker + Offline ===
if (swRegistration) {
  // 登録自体は上の awaitServiceWorkerControl と共用する (二重登録しない)
  swRegistration.then(reg => {
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      newSW.addEventListener('statechange', () => {
        if (newSW.state === 'activated') {
          document.getElementById('status').textContent += ' (更新完了)';
        }
      });
    });
    // 登録が失敗する環境(プライベートモード等)でも未処理rejectionを出さない。
    // SWが無くてもオンラインなら普通に動くので、ここは黙って諦めてよい。
  }).catch(e => console.warn('Service Worker を登録できませんでした:', e));

  // Request persistent storage
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(granted => {
      if (granted) {
        console.log('Persistent storage granted');
      } else {
        console.log('Persistent storage denied - cache may be evicted');
      }
    });
  }

  // 容量不足でキャッシュできなかったらユーザーに知らせる。黙って失敗すると
  // 「オフライン対応」と表示されたまま実際には動かない状態になる。
  navigator.serviceWorker.addEventListener('message', ev => {
    if (ev.data && ev.data.type === 'CACHE_QUOTA_EXCEEDED') {
      const el = document.getElementById('status');
      el.textContent = '端末の空き容量が足りず、オフライン用データを保存できませんでした。';
      el.style.color = '#dc2626';
    }
  });

  // オフライン準備状況の確認。
  // 旧実装は caches.open('transit-v9') を見ていた。キャッシュ名がv40まで進んでいるので
  // 常に空振りする上、caches.open は無ければ新規作成するので、毎回空のキャッシュを
  // 作っては次のactivateで消される、という無意味な往復をしていた。
  // 実際に必要なファイルが揃っているかをSWに直接問い合わせる。
  window.addEventListener('load', async () => {
    const sw = navigator.serviceWorker.controller;
    if (!sw) return; // 初回訪問。まだSWが制御していない
    const ch = new MessageChannel();
    ch.port1.onmessage = ev => {
      const d = ev.data || {};
      if (d.type !== 'CACHE_STATUS') return;
      const statusEl = document.getElementById('status');
      if (d.missing && d.missing.length === 0) {
        statusEl.textContent = statusEl.textContent.replace('オフライン対応', 'オフライン準備完了');
        statusEl.style.color = '#16a34a';
      } else {
        console.warn('オフライン用に未保存のファイル:', d.missing);
      }
    };
    sw.postMessage({ type: 'CACHE_STATUS' }, [ch.port2]);
  });
}

// Online/offline indicator
window.addEventListener('online', () => {
  document.getElementById('status').style.color = '';
});
window.addEventListener('offline', () => {
  document.getElementById('status').textContent = 'オフラインモード';
  document.getElementById('status').style.color = '#ea580c';
});
</script>
