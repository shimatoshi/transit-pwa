name: UI regression tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: gzip -dk trains_v3.bin.gz
      - run: node --test tests/*.cjs
      - run: node test_ui_render.js
      - run: node test_sw_cache.js

